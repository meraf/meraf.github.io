<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Meraf Legesse Sertse</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Outfit:wght@700;800&display=swap">
<style>
:root{--bg:#07090E;--sf:rgba(15, 20, 32, 0.8);--ln:rgba(40, 50, 75, 0.6);--tx:#F3F4F6;--mu:#9CA3AF;--ac:#D4AF37;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-content:center;gap:1.2rem;padding:2rem;font:400 1.05rem/1.7 'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);text-align:center}
.error-card{background:var(--sf);border:1px solid var(--ln);backdrop-filter:blur(20px);padding:3.5rem 2.5rem;border-radius:28px;max-width:500px;box-shadow:0 30px 60px rgba(0,0,0,0.4)}
h1{margin:0 0 .5rem;font-family:'Outfit',sans-serif;font-size:clamp(3.5rem,10vw,6rem);color:var(--ac);font-weight:800;letter-spacing:-.03em}
p{margin:0 0 2.2rem;color:var(--mu);font-size:1.1rem}
a{display:inline-flex;align-items:center;justify-content:center;padding:.9rem 2rem;border-radius:999px;background:var(--ac);color:#07090E;font-weight:700;text-decoration:none;box-shadow:0 6px 25px rgba(212,175,55,0.3);transition:all .25s}
a:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(212,175,55,0.4)}
</style>
</head>
<body>
<div class="error-card">
  <h1>404</h1>
  <p>The page you are trying to reach doesn't exist or has been relocated.</p>
  <a href="/">Return to Portfolio Page</a>
</div>
</body>
</html>
